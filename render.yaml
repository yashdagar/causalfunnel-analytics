services:
  - type: web
    name: causalfunnel-analytics-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.19.2"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        value: "*"
